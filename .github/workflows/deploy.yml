name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 必要なシークレット（Settings > Secrets and variables > Actions）
      #   FTP_SERVER      : FTP サーバーのホスト名
      #   FTP_USER        : FTP ユーザー名
      #   FTP_PASSWORD    : FTP パスワード
      #   FTP_SERVER_DIR  : デプロイ先ディレクトリ
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # .gitignore の除外ルールを無視してビルド成果物(dist/)もデプロイする
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            src/**
            .github/**
            .claude/**
            webpack.config.js
            package.json
            package-lock.json
            style.css
            .gitignore
          git-ftp-include: |
            dist/
